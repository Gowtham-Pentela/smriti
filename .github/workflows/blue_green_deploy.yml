name: Blue/Green CI/CD Deployment & Rollback

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform (deploy or rollback)'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback

jobs:
  deploy:
    name: Orchestrate Blue/Green Deployment
    runs-on: self-hosted
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Build + unit test gate. Run only the mocked unit test here; the live
      # e2e test (tests/test_agent_accuracy.py) needs a running backend + an
      # ingested corpus + Ollama, so it is a manual/integration check, not a
      # deploy gate.
      - name: Install dependencies & run unit tests
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          # Copy .env from parent project directory to workspace for tests
          cp /home/ubuntu/smriti/.env . || echo "⚠️ .env file not found in /home/ubuntu/smriti/.env"
          # Unit test only (mocked DB/backend). Live e2e is run manually, not in CI.
          python -m unittest tests.test_answer_quality

      # Run all DB migrations in sorted order before restarting the server
      - name: Run database migrations
        run: |
          source venv/bin/activate
          # Load DATABASE_URL from the server's .env
          export DATABASE_URL=$(grep '^DATABASE_URL=' /home/ubuntu/smriti/.env | cut -d '=' -f2-)
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ DATABASE_URL not found in .env — aborting"
            exit 1
          fi
          echo "Running migrations..."
          for f in $(ls -1 supabase/migrations/*.sql | sort); do
            echo "→ Applying $(basename $f)..."
            psql "$DATABASE_URL" -f "$f"
          done
          echo "✅ All migrations applied"

      # Deployment Logic for the VM
      - name: Execute Background Process CD Restart
        env:
          RUNNER_TRACKING_ID: ""
        run: |
          echo "=== STARTING AUTOMATED DEPLOYMENT ==="
          
          # 1. Stop the current running uvicorn process
          pkill -f "uvicorn backend.main:app" || true
          sleep 2
          
          # 2. Start the new uvicorn process in the background
          nohup venv/bin/python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 --workers 1 > uvicorn.log 2>&1 &
          sleep 5
          
          # 3. Perform automated health check to verify the new process started successfully
          #    Use /health (exists) with --fail so a 4xx/5xx actually fails the deploy.
          if ! curl -sf http://127.0.0.1:8000/health; then
            echo "❌ Health check failed! Printing server logs (uvicorn.log):"
            cat uvicorn.log
            exit 1
          fi
          echo "=== DEPLOYMENT COMPLETED SUCCESSFULLY ==="

      # ── Public ingress: Caddy terminates TLS for smriti.one and reverse-proxies
      #    to the loopback uvicorn. The Caddyfile is static (target never changes
      #    between deploys), so this step is idempotent: install once, rewrite the
      #    file, reload. Caddy obtains + renews the Let's Encrypt cert itself.
      #    NOTE: requires the runner user to have passwordless sudo (default on
      #    the Oracle Ubuntu image's `ubuntu` user). Also requires ports 80/443
      #    open in the Oracle Cloud VCN security list / NSG, not just iptables.
      - name: Configure Caddy reverse proxy (smriti.one + auto-TLS)
        run: |
          if ! command -v caddy >/dev/null 2>&1; then
            sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
            curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor --yes -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
            curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y caddy
          fi
          # The *.caddyinclude glob is silently skipped when no include file
          # exists, so an operator-placed auth gate (e.g. /etc/caddy/basicauth.caddyinclude)
          # persists across deploys without its credential ever entering git.
          sudo tee /etc/caddy/Caddyfile >/dev/null <<'CADDYFILE'
          smriti.one {
              import /etc/caddy/*.caddyinclude
              reverse_proxy 127.0.0.1:8000
          }
          CADDYFILE
          # Ensure 80/443 accept locally (idempotent; Oracle security list is the real gate)
          sudo iptables -C INPUT -p tcp --dport 80 -j ACCEPT 2>/dev/null || sudo iptables -I INPUT -p tcp --dport 80 -j ACCEPT
          sudo iptables -C INPUT -p tcp --dport 443 -j ACCEPT 2>/dev/null || sudo iptables -I INPUT -p tcp --dport 443 -j ACCEPT
          sudo systemctl enable --now caddy
          sudo systemctl reload caddy || sudo systemctl restart caddy
          echo "=== CADDY SERVING https://smriti.one -> 127.0.0.1:8000 ==="
