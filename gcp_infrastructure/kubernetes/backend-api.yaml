apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
      - name: api
        image: gcr.io/your-project-id/knowledge-guardian-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres_user:postgres_password@10.0.2.2:5432/knowledge_guardian" # Private Cloud SQL IP
        - name: OLLAMA_URL
          value: "http://ollama-gpu-service:11434/api/generate"
        - name: EMBED_URL
          value: "http://ollama-gpu-service:11434/api/embeddings"
        resources:
          limits:
            memory: 2Gi
            cpu: "1"
          requests:
            memory: 512Mi
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api-service
  namespace: default
spec:
  ports:
  - port: 80
    targetPort: 8000
  selector:
    app: backend-api
  type: NodePort # NodePort is required when routing traffic from a GCP HTTPS Load Balancer
---
# GCP Identity-Aware Proxy (IAP) Ingress
# Automatically handles SSO & OAuth2. Passes user headers to backend for RBAC.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledge-guardian-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "gclb" # Google Cloud HTTPS Load Balancer
    networking.gke.io/v1beta1.FrontendConfig: "ingress-frontend-config"
spec:
  rules:
  - http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: backend-api-service
            port:
              number: 80
