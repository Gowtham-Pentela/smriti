apiVersion: apps/v1
kind: Deployment
metadata:
  name: kgf-ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kgf-ui
  template:
    metadata:
      labels:
        app: kgf-ui
    spec:
      containers:
      - name: ui
        image: gcr.io/YOUR_PROJECT_ID/kgf-ui:latest
        ports:
        - containerPort: 8501
        env:
        - name: BACKEND_URL
          value: "http://backend-api-service:80"
        resources:
          limits:
            memory: 512Mi
            cpu: "500m"
          requests:
            memory: 256Mi
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: kgf-ui-service
  namespace: default
spec:
  ports:
  - port: 80
    targetPort: 8501
  selector:
    app: kgf-ui
  type: NodePort
---
# Ingress for the UI — this is the public URL you send to customers
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kgf-ui-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "gclb"
spec:
  rules:
  - http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: kgf-ui-service
            port:
              number: 80
