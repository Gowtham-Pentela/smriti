# Nginx Configuration for Blue/Green Deployments on virtual machines / Compute Engine instances.
#
# Put the active configuration under /etc/nginx/conf.d/smriti.conf and reload nginx to route traffic.

# 1. Configuration for BLUE (port 8000)
# Save as: /etc/nginx/conf.d/smriti-blue.conf
upstream smriti_backend_blue {
    server 127.0.0.1:8000;
}

# 2. Configuration for GREEN (port 9000)
# Save as: /etc/nginx/conf.d/smriti-green.conf
upstream smriti_backend_green {
    server 127.0.0.1:9000;
}

# 3. Main Nginx Virtual Host
# Under /etc/nginx/conf.d/smriti.conf:
# proxy_pass will route to the currently selected active upstream alias
server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://127.0.0.1:8000; # Initially points to Blue
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enable WebSockets support (for chat streaming / polling)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
