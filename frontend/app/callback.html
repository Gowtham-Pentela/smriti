<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing in… — Smriti</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/smriti_logo_32.png">
    <link rel="shortcut icon" type="image/png" href="images/smriti_logo_32.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0a0a0f;
            color: #e8e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 20% 30%, rgba(99, 102, 241, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 80% 70%, rgba(139, 92, 246, 0.06) 0%, transparent 60%);
            pointer-events: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .brand img {
            border-radius: 8px;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
        }

        /* Spinner */
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(99, 102, 241, 0.15);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            max-width: 280px;
            line-height: 1.6;
        }

        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 13px;
            max-width: 340px;
            text-align: center;
            display: none;
        }

        .retry-link {
            display: none;
            color: #6366f1;
            font-size: 13px;
            text-decoration: none;
            margin-top: 8px;
        }

        .retry-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="brand">
        <img src="images/smriti_logo_32.png" alt="Smriti" width="32" height="32">
        <span class="brand-name">Smriti</span>
    </div>

    <div class="spinner" id="spinner"></div>
    <p class="status" id="status-msg">Completing sign-in…</p>
    <div class="error-box" id="error-box"></div>
    <a href="/app/auth.html" class="retry-link" id="retry-link">← Back to sign in</a>

    <script src="/app/js/supabase.js"></script>
    <script>
        // ─── This page's ONLY job: process the OAuth callback and get to index.html ───
        // It resolves security vectors by requesting configurations asynchronously at runtime.

        let _sb = null;
        let handled = false;

        function showError(msg) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('status-msg').style.display = 'none';
            const errBox = document.getElementById('error-box');
            errBox.textContent = msg;
            errBox.style.display = 'block';
            document.getElementById('retry-link').style.display = 'inline';
        }

        function goToApp() {
            document.getElementById('status-msg').textContent = 'Signed in! Loading your workspace…';
            // Small delay to ensure localStorage write is flushed cleanly
            setTimeout(() => {
                window.location.replace('/app/index.html');
            }, 150);
        }

        // Runtime configuration asynchronous listener matrix
        const _sbReady = (async () => {
            try {
                const isLocal = window.location.protocol === 'file:' || ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname);
                const _API_BASE = isLocal ? 'http://127.0.0.1:8000' : window.location.origin;
                const res = await fetch(_API_BASE + '/client-config');
                if (!res.ok) throw new Error('Failed to load client security configurations.');
                const config = await res.json();

                // Dynamically instantiate Supabase using the backend injection profile
                const sbUrl = config.supabase_url || config.SUPABASE_URL;
                const sbKey = config.supabase_anon || config.SUPABASE_ANON_KEY || config.supabase_anon_key;
                if (!sbUrl || !sbKey) throw new Error('Invalid Supabase configuration received.');

                _sb = supabase.createClient(sbUrl, sbKey, {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: true,
                    }
                });

                // Primary: SIGNED_IN fires after PKCE exchange completes successfully
                _sb.auth.onAuthStateChange((event, session) => {
                    if (handled) return;
                    if (event === 'SIGNED_IN' && session) {
                        handled = true;
                        goToApp();
                    }
                });

                return _sb;
            } catch (err) {
                console.error('Initialization Fault:', err);
                showError('Security runtime context failed to compile.');
            }
        })();

        // Active verification event loop matching runtime constraints
        window.addEventListener('DOMContentLoaded', async () => {
            await _sbReady;
            if (!_sb) return;

            // Fallback: poll getSession() in case SIGNED_IN event hangs
            let attempts = 0;
            const maxAttempts = 20; // 20 × 500ms = 10 seconds max

            while (attempts < maxAttempts) {
                await new Promise(r => setTimeout(r, 500));
                if (handled) return; // Sequence already addressed, break evaluation loop

                const { data: { session } } = await _sb.auth.getSession();
                if (session) {
                    if (!handled) {
                        handled = true;
                        goToApp();
                    }
                    return;
                }
                attempts++;
            }

            // Terminate evaluation tracking if window exceeds bounds without session validation
            if (!handled) {
                handled = true;
                showError('Sign-in could not be completed. Please try again.');
            }
        });

        // Guardrail fallback timeout sentinel
        setTimeout(() => {
            if (!handled) {
                handled = true;
                showError('Sign-in timed out. Please try again.');
            }
        }, 10000);
    </script>
</body>

</html>
