<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Smriti</title>
    <meta name="description" content="Sign in to Smriti, the organizational knowledge layer for AI agents.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:           #0a0a0f;
            --bg-card:      rgba(18, 18, 28, 0.85);
            --border:       rgba(255,255,255,0.08);
            --border-focus: rgba(99,102,241,0.5);
            --text:         #e8e8f0;
            --text-muted:   rgba(255,255,255,0.45);
            --indigo:       #6366f1;
            --indigo-dim:   rgba(99,102,241,0.12);
            --indigo-glow:  rgba(99,102,241,0.3);
            --emerald:      #10b981;
            --red:          #ef4444;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 20% 30%, rgba(99,102,241,0.08) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 80% 70%, rgba(139,92,246,0.06) 0%, transparent 60%);
            pointer-events: none;
        }

        .auth-card {
            position: relative;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            margin: 20px;
            box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03) inset;
        }

        /* Brand */
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
        }
        .brand-shield {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(139,92,246,0.15));
            border: 1px solid rgba(99,102,241,0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-name {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #e8e8f0, rgba(255,255,255,0.6));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .brand-tagline {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 4px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 28px;
        }
        .tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
        }
        .tab.active {
            background: rgba(99,102,241,0.15);
            color: var(--indigo);
            border: 1px solid rgba(99,102,241,0.2);
        }

        /* OAuth buttons */
        .oauth-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 11px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 10px;
        }
        .oauth-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); transform: translateY(-1px); }
        .oauth-btn:active { transform: translateY(0); }
        .oauth-btn svg { flex-shrink: 0; }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Form */
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
        .field input {
            width: 100%;
            padding: 10px 13px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }
        .field input:focus { border-color: var(--border-focus); background: rgba(99,102,241,0.05); }
        .field input::placeholder { color: var(--text-muted); }

        .btn-primary {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, var(--indigo), #8b5cf6);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
            margin-top: 4px;
            position: relative;
            overflow: hidden;
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.08));
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(99,102,241,0.35); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* Messages */
        .msg {
            font-size: 13px;
            padding: 10px 13px;
            border-radius: 8px;
            margin-top: 14px;
            display: none;
        }
        .msg.show { display: block; }
        .msg.success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2); color: #34d399; }
        .msg.error   { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.2);  color: #f87171; }
        .msg.info    { background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.2); color: #a5b4fc; }

        /* Verification notice */
        .verify-notice {
            text-align: center;
            padding: 20px 0 8px;
        }
        .verify-notice .icon { font-size: 32px; margin-bottom: 12px; }
        .verify-notice h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .verify-notice p { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
        .verify-notice .resend-btn {
            background: none;
            border: none;
            color: var(--indigo);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            margin-top: 14px;
            text-decoration: underline;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 24px;
            line-height: 1.6;
        }
        .footer-note a { color: var(--indigo); text-decoration: none; }
    </style>
</head>
<body>

<div class="auth-card">
    <!-- Brand -->
    <div class="brand">
        <img src="images/smriti_logo.png" alt="Smriti" width="36" height="36" style="border-radius:10px;flex-shrink:0;">
        <div>
            <div class="brand-name">Smriti</div>
            <div style="font-size:11px;color:var(--text-muted)">Organizational knowledge layer</div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs" id="tabs">
        <div class="tab active" id="tab-signin" onclick="switchTab('signin')">Sign in</div>
        <div class="tab" id="tab-signup" onclick="switchTab('signup')">Create account</div>
    </div>

    <!-- Email verification screen (hidden by default) -->
    <div id="verify-screen" style="display:none">
        <div class="verify-notice">
            <div class="icon">📬</div>
            <h3>Check your email</h3>
            <p>We sent a verification link to <strong id="verify-email-addr"></strong>.<br>
               Click the link to activate your account and sign in.</p>
            <button class="resend-btn" id="resend-btn" onclick="resendVerification()">Resend email</button>
        </div>
    </div>

    <!-- Main auth form -->
    <div id="auth-form">
        <!-- OAuth -->
        <button class="oauth-btn" id="btn-google" onclick="signInWithGoogle()">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
                <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
                <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
            </svg>
            Continue with Google
        </button>

        <button class="oauth-btn" id="btn-github" onclick="signInWithGitHub()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
            </svg>
            Continue with GitHub
        </button>

        <div class="divider">or with email</div>

        <!-- Sign-in form -->
        <div id="form-signin">
            <div class="field">
                <label for="signin-email">Email address</label>
                <input type="email" id="signin-email" placeholder="you@company.com" autocomplete="email">
            </div>
            <div class="field">
                <label for="signin-password">Password</label>
                <input type="password" id="signin-password" placeholder="Your password" autocomplete="current-password">
            </div>
            <button class="btn-primary" id="btn-signin" onclick="signInWithEmail()">Sign in</button>
        </div>

        <!-- Sign-up form -->
        <div id="form-signup" style="display:none">
            <div class="field">
                <label for="signup-email">Work email</label>
                <input type="email" id="signup-email" placeholder="you@company.com" autocomplete="email">
            </div>
            <div class="field">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" placeholder="At least 8 characters" autocomplete="new-password">
            </div>
            <button class="btn-primary" id="btn-signup" onclick="signUpWithEmail()">Create account</button>
        </div>

        <div class="msg" id="auth-msg"></div>
    </div>

    <p class="footer-note">
        By signing in you agree to our
        <a href="/app/terms.html" target="_blank">Terms</a> and
        <a href="/app/privacy.html" target="_blank">Privacy Policy</a>.
    </p>
</div>

<!-- Supabase JS v2 (loaded from CDN fallback via index redirect — see supabase.js removal note) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ── Supabase client initialisation (credentials loaded from backend) ──────────
// Credentials are fetched from /client-config rather than embedded in this file.
// This keeps the anon key out of version control and allows key rotation without
// touching frontend assets.
let sb;           // Supabase client — set once _sbReady resolves
let _sbReady;     // Promise that resolves after the client is initialised

(function initSupabaseFromConfig() {
    const _API_BASE_INIT = (window.location.protocol === 'file:' || window.location.hostname === 'localhost')
        ? 'http://localhost:8000' : window.location.origin;

    _sbReady = fetch(`${_API_BASE_INIT}/client-config`)
        .then(r => {
            if (!r.ok) throw new Error(`/client-config returned ${r.status}`);
            return r.json();
        })
        .then(cfg => {
            const { createClient } = supabase;
            sb = createClient(cfg.supabase_url, cfg.supabase_anon);
        })
        .catch(err => {
            console.error('[auth] Failed to load Supabase config:', err);
            // Surface a visible error so the user knows the backend is unreachable
            document.body.innerHTML =
                `<div style="color:#ef4444;font-family:monospace;padding:40px">
                    Backend unreachable — could not load authentication config.<br>
                    <small>${err.message}</small>
                </div>`;
            throw err; // re-throw so callers of _sbReady see the rejection
        });
})();

// ── Session gate ──────────────────────────────────────────────────────────
// CRITICAL: Use getUser() NOT getSession() here.
// getSession() only reads localStorage and returns a session even when the
// access_token is expired — which causes a redirect to index.html with an
// invalid token, triggering SIGNED_OUT there, causing an infinite loop.
// getUser() makes a real network call to Supabase to validate the token.
// If the token is expired, it returns an error and we show the login form.
(async () => {
    await _sbReady;
    const { data: { user }, error } = await sb.auth.getUser();
    if (user && !error) {
        // Token is valid (server-confirmed) — skip sign-in, go straight to app
        window.location.replace('/app/index.html');
    } else {
        // Clean out any stale/expired local storage sessions to prevent redirect issues
        await sb.auth.signOut().catch(() => {});
    }
})();


let pendingSignupEmail = '';

// Ensure browser Back from auth returns users to the landing page.
if (window.history && window.history.pushState) {
    window.history.pushState({ authPage: true }, document.title, window.location.href);
    window.addEventListener('popstate', () => {
        window.location.replace('/app/landing.html');
    });
}

// ── Tab switching ─────────────────────────────────────────────────────────
function switchTab(tab) {
    const isSignin = tab === 'signin';
    document.getElementById('tab-signin').classList.toggle('active', isSignin);
    document.getElementById('tab-signup').classList.toggle('active', !isSignin);
    document.getElementById('form-signin').style.display = isSignin ? '' : 'none';
    document.getElementById('form-signup').style.display = isSignin ? 'none' : '';
    clearMsg();
}

// ── Message helpers ───────────────────────────────────────────────────────
function showMsg(text, type = 'error') {
    const el = document.getElementById('auth-msg');
    el.textContent = text;
    el.className = `msg ${type} show`;
}
function clearMsg() {
    const el = document.getElementById('auth-msg');
    el.className = 'msg';
}
function setLoading(btnId, loading, label) {
    const btn = document.getElementById(btnId);
    if (btn) { btn.disabled = loading; btn.textContent = loading ? 'Please wait...' : label; }
}

// ── Google OAuth ──────────────────────────────────────────────────────────
async function signInWithGoogle() {
    await _sbReady;
    clearMsg();
    const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/app/callback.html' },
    });
    if (error) showMsg(error.message);
}

// ── GitHub OAuth ──────────────────────────────────────────────────────────
async function signInWithGitHub() {
    await _sbReady;
    clearMsg();
    const { error } = await sb.auth.signInWithOAuth({
        provider: 'github',
        options: { redirectTo: window.location.origin + '/app/callback.html' },
    });
    if (error) showMsg(error.message);
}

// ── Email sign-in ─────────────────────────────────────────────────────────
async function signInWithEmail() {
    await _sbReady;
    clearMsg();
    const email    = document.getElementById('signin-email').value.trim();
    const password = document.getElementById('signin-password').value;
    if (!email || !password) { showMsg('Enter your email and password.'); return; }

    setLoading('btn-signin', true, 'Sign in');
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    setLoading('btn-signin', false, 'Sign in');

    if (error) {
        if (error.message.includes('Email not confirmed')) {
            showMsg('Please verify your email before signing in. Check your inbox.', 'info');
        } else {
            showMsg(error.message);
        }
    } else if (data && data.session) {
        window.location.replace('/app/index.html');
    }
}

// ── Email sign-up ─────────────────────────────────────────────────────────
async function signUpWithEmail() {
    await _sbReady;
    clearMsg();
    const email    = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    if (!email)           { showMsg('Enter your work email.');        return; }
    if (password.length < 8) { showMsg('Password must be at least 8 characters.'); return; }

    setLoading('btn-signup', true, 'Create account');
    const { error } = await sb.auth.signUp({
        email,
        password,
        options: { emailRedirectTo: window.location.origin + '/app/callback.html' },
    });
    setLoading('btn-signup', false, 'Create account');

    if (error) { showMsg(error.message); return; }

    // Show verification screen
    pendingSignupEmail = email;
    document.getElementById('verify-email-addr').textContent = email;
    document.getElementById('auth-form').style.display = 'none';
    document.getElementById('verify-screen').style.display = '';
    document.getElementById('tabs').style.display = 'none';
}

// ── Resend verification email ─────────────────────────────────────────────
async function resendVerification() {
    await _sbReady;
    if (!pendingSignupEmail) return;
    const btn = document.getElementById('resend-btn');
    btn.disabled = true;
    btn.textContent = 'Sending...';
    const { error } = await sb.auth.resend({
        type: 'signup',
        email: pendingSignupEmail,
        options: { emailRedirectTo: window.location.origin + '/app/callback.html' },
    });
    btn.textContent = error ? 'Failed — try again' : 'Sent! Check your inbox';
    setTimeout(() => { btn.disabled = false; btn.textContent = 'Resend email'; }, 5000);
}

// ── Enter key support ─────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const signinVisible = document.getElementById('form-signin').style.display !== 'none';
    if (signinVisible) signInWithEmail();
    else               signUpWithEmail();
});
</script>
<!-- GDPR / Cookie Consent Module -->
<script src="/app/gdpr-consent.js"></script>
</body>
</html>
