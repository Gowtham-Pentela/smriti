  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    const { motion, useScroll, useTransform } = window.Motion;

    // Suppress key warning console logs for Framer Motion / Babel simulation
    const originalError = console.error;
    console.error = (...args) => {
      if (args[0] && typeof args[0] === 'string' && args[0].includes('Each child in a list should have a unique "key"')) {
        return;
      }
      originalError(...args);
    };

    // ── REUSABLE COMPONENT: FADE IN ANIMATION ──
    const FadeIn = ({ children, delay = 0, duration = 0.7, x = 0, y = 30, className, style }) => {
      return (
        <motion.div
          initial={{ opacity: 0, x, y }}
          whileInView={{ opacity: 1, x: 0, y: 0 }}
          viewport={{ once: true, margin: "50px", amount: 0 }}
          transition={{ delay, duration, ease: [0.25, 0.1, 0.25, 1] }}
          className={className}
          style={style}
        >
          {children}
        </motion.div>
      );
    };

    // ── REUSABLE COMPONENT: MOUSE-FOLLOW MAGNET CONTAINER WITH 3D TILT ──
    const Magnet = ({ children, padding = 150, strength = 3, activeTransition = "transform 0.3s ease-out", inactiveTransition = "transform 0.6s ease-in-out", className, style }) => {
      const [position, setPosition] = useState({ x: 0, y: 0, rotX: 0, rotY: 0 });
      const ref = useRef(null);

      const handleMouseMove = (e) => {
        if (!ref.current) return;
        const rect = ref.current.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const distanceX = e.clientX - centerX;
        const distanceY = e.clientY - centerY;
        const distance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);

        if (distance < padding) {
          const x = distanceX / strength;
          const y = distanceY / strength;
          const rotX = -(distanceY / (rect.height / 2)) * 15;
          const rotY = (distanceX / (rect.width / 2)) * 15;
          setPosition({ x, y, rotX, rotY });
        } else {
          setPosition({ x: 0, y: 0, rotX: 0, rotY: 0 });
        }
      };

      const handleMouseLeave = () => {
        setPosition({ x: 0, y: 0, rotX: 0, rotY: 0 });
      };

      useEffect(() => {
        window.addEventListener('mousemove', handleMouseMove);
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, [padding, strength]);

      return (
        <div
          ref={ref}
          className={className}
          style={{
            ...style,
            transform: `perspective(1000px) rotateX(${position.rotX}deg) rotateY(${position.rotY}deg) translate3d(${position.x}px, ${position.y}px, 0)`,
            transition: position.x === 0 && position.y === 0 ? inactiveTransition : activeTransition,
            willChange: 'transform'
          }}
          onMouseLeave={handleMouseLeave}
        >
          {children}
        </div>
      );
    };

    // ── REUSABLE COMPONENT: CHARACTER-BY-CHARACTER SCROLL REVEAL ──
    const AnimatedText = ({ text }) => {
      const containerRef = useRef(null);
      const { scrollYProgress } = useScroll({
        target: containerRef,
        offset: ['start 0.8', 'end 0.2']
      });

      const characters = useMemo(() => text.split(""), [text]);

      return (
        <p ref={containerRef} className="text-[#D7E2EA] font-medium text-center leading-relaxed font-sans max-w-[560px]" style={{ fontSize: 'clamp(1rem, 2vw, 1.35rem)' }}>
          {characters.map((char, index) => {
            const start = index / characters.length;
            const end = (index + 1) / characters.length;
            const opacity = useTransform(scrollYProgress, [start, end], [0.2, 1.0]);

            return (
              <motion.span key={index} style={{ opacity }} className="relative">
                {char}
              </motion.span>
            );
          })}
        </p>
      );
    };
    // Expose LaunchSmritiButton globally for runtime JSX usage

    // ── REUSABLE COMPONENT: STICKY PROJECT STACK CARD WITH 3D HOVER TILT ──
    const StickyProjectCard = ({ card, index, totalCards }) => {
      const containerRef = useRef(null);
      const cardRef = useRef(null);
      const [tilt, setTilt] = useState({ rotX: 0, rotY: 0, scale: 1 });

      const { scrollYProgress } = useScroll({
        target: containerRef,
        offset: ["start start", "end start"]
      });

      const minScale = 1 - (totalCards - 1 - index) * 0.03;
      const scale = useTransform(scrollYProgress, [0, 1], [1, minScale]);
      const opacity = useTransform(scrollYProgress, [0, 0.85], [1, 0.75]);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotX = -((y - centerY) / centerY) * 6; // max 6 degrees
        const rotY = ((x - centerX) / centerX) * 6;  // max 6 degrees

        setTilt({ rotX, rotY, scale: 1.02 });
      };

      const handleMouseLeave = () => {
        setTilt({ rotX: 0, rotY: 0, scale: 1 });
      };

      return (
        <div
          ref={containerRef}
          className="h-[85vh] flex items-center justify-center sticky top-0"
          style={{ top: `${index * 28 + 96}px`, perspective: '1000px' }}
        >
          <motion.div
            style={{ scale, opacity }}
            className="w-full max-w-6xl h-[65vh]"
          >
            <motion.div

              onMouseMove={handleMouseMove}
              onMouseLeave={handleMouseLeave}
              animate={{
                rotateX: tilt.rotX,
                rotateY: tilt.rotY,
                scale: tilt.scale
              }}
              transition={{ type: "spring", stiffness: 300, damping: 20 }}
              className="w-full h-full rounded-[40px] sm:rounded-[50px] md:rounded-[60px] border-2 border-[#D7E2EA] bg-[#0C0C0C] p-5 sm:p-8 md:p-10 flex flex-col justify-between shadow-[0_24px_50px_rgba(0,0,0,0.8)] relative cursor-pointer"
              style={{ transformStyle: 'preserve-3d' }}
            >

                  </h3>
                </div>
                <div className="flex items-center gap-4 sm:gap-8">

                  </span>

                </div>
              </div>

              {/* Bottom row: Two column image grid */}
